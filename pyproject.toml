[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awrise"
version = "0.1.0"
description = "Wake something on a schedule, let it do one thing, and put it back to sleep"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AitherOS Contributors", email = "dp27148@gmail.com"}
]

[project.scripts]
awrise = "awrise.cli:main"
