[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awrise"
version = "0.2.1"
description = "Wake something on a schedule, let it do one thing, and put it back to sleep"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AitherOS Contributors", email = "dp27148@gmail.com"}
]

[project.scripts]
awrise = "awrise.cli:main"

# awrise ships for requires-python >=3.10, but the repo-root ruff config targets
# py314. Under a py314 target `ruff format` applies PEP 758 and REWRITES
# `except (A, B):` into `except A, B:` -- valid on 3.14, a SyntaxError on the
# 3.12 interpreter that runs this package, and `ruff check` still passes it
# because it is valid for the configured target. Pin the target to the floor we
# actually support so formatting can never outrun the runtime.
[tool.ruff]
# SELF-CONTAINED on purpose: awrise is standalone by contract (scripts/
# check_moat_boundary.py), and `extend = "../../pyproject.toml"` makes
# `ruff check` die with "Failed to load extended configuration" for anyone who
# extracts the published sdist. These values mirror the repo root's effective
# rules for packages/**, with the target pinned to our own requires-python.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E501 is the repo-root ignore; the rest are its per-file-ignores for packages/**.
ignore = ["E501", "E402", "E701", "E721", "F401", "F821", "I001", "N802", "N999"]

# `_doctor.py` is GENERATED by AitherOS/dev/tools/gen_aw_doctor.py, which owns its
# layout. Formatting it here makes `gen_aw_doctor.py --check` report drift on a file
# nobody hand-edited. Excluded from the FORMATTER only -- it is still linted.
[tool.ruff.format]
exclude = ["awrise/_doctor.py"]
